# GitHub Pages site (https://bsgonzalezq.github.io/ps-pkg-title-renamer/): the README is the page.
title: PS4 / PS5 PKG Title Renamer
tagline: Rename PS4 & PS5 PKG files to game names   # search result title: "<title> | <tagline>"
description: >-
  Rename PS4 and PS5 .pkg files (base game, patch, DLC), PS5 / dumped PS4 game folders and
  CUSA / PPSA title-ID folders to game names using param.sfo / param.json. Optional title ID,
  version, region, console and content ID tags, undo, Excel export. Python, Linux/macOS/Windows.
url: https://bsgonzalezq.github.io
baseurl: /ps-pkg-title-renamer
lang: en
theme: jekyll-theme-cayman
defaults:
  - scope:
      path: ""
    values:
      image: /assets/social-preview.png   # share / Open Graph image
author: bsgonzalezq
github:
  is_project_page: true
plugins:
  - jekyll-seo-tag     # <title>, meta description, Open Graph / Twitter cards
  - jekyll-sitemap     # sitemap.xml for Google Search Console / Bing Webmaster Tools
# Site ownership for Google Search Console / Bing Webmaster Tools: paste the codes they give
# you ("HTML tag" method, only the content="..." value) and push.
# webmaster_verifications:
#   google: PASTE_GOOGLE_CODE
#   bing: PASTE_BING_CODE
exclude:
  - install_prereqs.sh
  - install_prereqs.ps1
  - requirements.txt
  - "*.py"
  - "*.log"
  - "*.db"
